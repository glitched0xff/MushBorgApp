services:
  homepage:
    image: ghcr.io/benphelps/homepage:latest
    container_name: homepage
    user: "0:0"
    ports:
      - '80:3000' # Sarà accessibile inizialmente sulla porta 3005
    volumes:
      -  ~/docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock # Opzionale: mostra lo stato dei container
      - ~/docker/homepage/config/images:/app/public/images
    restart: unless-stopped
