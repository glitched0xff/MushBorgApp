# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/community/lovelace-card-mod/card-mod.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Aggiunta automazioni alla barra di sx
panel_custom: !include customMenuBar.yaml

# MQTT
mqtt: !include mqtt.yaml

# Restful ecowitt WH2650A completo
rest: !include rest.yaml

# Integrazione con Mushborg
rest_command: !include restCommand.yaml

homeassistant:
  packages: !include_dir_named packages

lovelace:
  mode: storage # Mantiene le plance standard create via interfaccia
  dashboards:
    pastorizzazione-pkg: # ID univoco della plancia
      mode: yaml
      title: Pastorizzazione
      icon: mdi:thermometer-water
      show_in_sidebar: true
      filename: plancia_pastorizzazione.yaml # Il file creato al punto 1
