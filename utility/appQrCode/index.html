<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Hello, world!</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
  </head>
  <body>
    <h1>Hello, world!</h1>
    
    <div class="row w-100">
        <div class="col-12">
        <div  class="col-6 text-center mx-auto" id="qr-reader" style="width:500px"></div>

        </div>
        <div  class="col" id="qr-reader-results"></div>
        <div class="col">
            <button type="button" name="" id="goToPage_btn" style="width: 200px !important; display: none;" class="btn btn-primary" btn-lg btn-block"> Vai al link</button>
        </div>
    </div>
    <div class="row w-100 py-3 ">
        <div class="col-6 mx-auto my-2" id="setHost_wrp">
            <form class="form">
                <div class="form-group">
                    <label for="">Inserisci l'indirizzo del server</label>
                    <input type="text" name="newHost" id="newHost" class="form-control" placeholder="" aria-describedby="helpId">
                    <small id="helpId" class="text-muted">es: mushborg.local:3006</small>
                </div>
                <button type="button" class="btn btn-primary" id="setHost_Btn">Salva il server</button>
            </form>

        </div>
        <div class="col-6 mx-auto my-2" id="showHost_wrp">
            <div class="row w-100">
                <div class="col">
                    <div class="col" id="hostVal"></div>
                </div>
                <div class="col">
                    <button type="button" class="btn btn-primary btn-sm" id="modHost_Btn">Modifica l'host</button>
                </div>
            </div>
        </div>
    </div>
  </body>
  <script>
    let qrDecoded
    let host
    function docReady(fn) {
        // see if DOM is already available
        if (document.readyState === "complete"
            || document.readyState === "interactive") {
            // call on next available tick
            setTimeout(fn, 1);
        } else {
            document.addEventListener("DOMContentLoaded", fn);
        }
    }

    docReady(function () {
        var resultContainer = document.getElementById('qr-reader-results');
        var lastResult, countResults = 0;
        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText !== lastResult) {
                ++countResults;
                lastResult = decodedText;
                // Handle on success condition with the decoded message.
                console.log(`Scan result ${decodedText}`, decodedResult);
                qrDecoded=decodedText
                document.getElementById(qr-reader-results).innerHTML = qrDecoded
            }
        }

        var html5QrcodeScanner = new Html5QrcodeScanner(
            "qr-reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        $(document).ready(function () {
           host=localStorage.getItem('host');
            if((host)&&(host!=null)){
                // Se host settato
                $("#setHost_wrp").hide();
                $("#showHost_wrp").show();
                $("#hostVal").html(host);
            }else{
                // per settare host
                $("#setHost_wrp").show();
                $("#showHost_wrp").hide();
            }

            $("#setHost_Btn").click(function (e) { 
                e.preventDefault();
                let newHost=$("#newHost").val();
                localStorage.setItem('host', newHost);
                host=newHost
                $("#hostVal").html(host);
                console.log($("#hostVal").val())
                $("#setHost_wrp").hide();
                $("#showHost_wrp").show();

            });

            $("#modHost_Btn").click(function (e) { 
                e.preventDefault();
                $("#setHost_wrp").show();
                $("#showHost_wrp").hide();
                localStorage.setItem('host', null);
            });
            $("#qr-reader-results").change(function (e) { 
                e.preventDefault();
                $("#goToPage_btn").show();
            });
            $("#goToPage_btn").click(function (e) { 
                e.preventDefault();
                let url=host+qrDecoded
                window.open(url, '_blank');
            });
        });
    });
</script>
</html>
